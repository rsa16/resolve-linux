[package]
name = "resolve-linux"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
description = "DaVinci Resolve Install Helper"
license = "GPL-3.0-or-later"

[dependencies]
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
nix = { version = "0.31.3", features = ["fs", "term", "user"] }
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
